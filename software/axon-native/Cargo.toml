[package]
name = "axon-native"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "axon-native"
path = "src/main.rs"

[dependencies]
rppal = "0.19"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rumqttc = "0.24"
tiny_http = "0.12"
ctrlc = "3"

[profile.release]
opt-level = 3
lto = true
