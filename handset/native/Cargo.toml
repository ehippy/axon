[package]
name = "axon-native"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "axon-native"
path = "src/main.rs"
required-features = ["hardware"]

[features]
default = []
hardware = ["dep:rppal", "dep:rumqttc", "dep:tiny_http", "dep:ctrlc"]

[dependencies]
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rumqttc = { version = "0.24", optional = true }
tiny_http = { version = "0.12", optional = true }
ctrlc = { version = "3", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rppal = { version = "0.19", optional = true }

[profile.release]
opt-level = 3
lto = true
