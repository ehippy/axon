name: Components
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test broker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mosquitto mosquitto-clients
      - name: Check portable handset
        run: |
          cargo fmt --check --manifest-path handset/native/Cargo.toml
          cargo test --locked --manifest-path handset/native/Cargo.toml
          cargo build --locked --example project --manifest-path handset/native/Cargo.toml
      - name: Check Python components and broker-to-handset path
        env:
          AXON_HANDSET_PROJECTOR: ${{ github.workspace }}/handset/native/target/debug/examples/project
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tools/test.py
      - name: Check source privacy patterns
        run: python tools/check_privacy.py
  release-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build independent Python and plugin artifacts
        run: |
          python -m pip install setuptools wheel
          python tools/build.py --output dist/release
          python tools/verify_release.py dist/release
          python tools/check_privacy.py --release dist/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-and-plugin-artifacts
          path: dist/release
  linux-handset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu
      - name: Build Linux ARM64 handset
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --target aarch64-unknown-linux-gnu --features hardware --manifest-path handset/native/Cargo.toml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: handset-linux-aarch64
          path: handset/native/target/aarch64-unknown-linux-gnu/release/axon-native
