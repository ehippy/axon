name: Components
# Server, protocol, package and plugin checks only. The handset has its own path in
# handset.yml, so Rust builds never hold up a server deploy.
on:
  push:
    paths-ignore:
      - 'handset/**'
      - '.github/workflows/handset.yml'
  pull_request:
    paths-ignore:
      - 'handset/**'
      - '.github/workflows/handset.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test broker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mosquitto mosquitto-clients
      - name: Check Python components and broker path
        env:
          # The Rust projector is exercised by handset.yml; the broker test skips it when unset.
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tools/test.py
      - name: Check source privacy patterns
        run: python tools/check_privacy.py
  release-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build independent Python and plugin artifacts
        run: |
          python -m pip install setuptools wheel
          python tools/build.py --output dist/release
          python tools/verify_release.py dist/release
          python tools/check_privacy.py --release dist/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-and-plugin-artifacts
          path: dist/release
