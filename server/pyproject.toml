[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axon-server"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = ['axon-protocol==0.3.0']

[project.scripts]
axon-server = "axon_server.journal:main"

[tool.setuptools]
packages = ['axon_server']

[tool.setuptools.package-data]
axon_server = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg", "web/icons/*.svg", "web/icons/LICENSE"]
